# Pubblica il sito su GitHub Pages a ogni push su main (o a mano da Actions → "Run workflow").
# GitHub compila il progetto (npm run build: pagine en/it/fr pre-generate) e pubblica dist/.
name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# un solo rilascio alla volta; quello in corso finisce prima di partire con il successivo
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # chiede a GitHub a che indirizzo sta pubblicando: oggi anto287.github.io/sitoVale,
      # col dominio personalizzato www.vallyski.com. La build si adatta da sola (src/site.ts).
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
