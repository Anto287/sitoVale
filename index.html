<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Il sito ha già le sue lingue (en / it / fr): la traduzione automatica del browser riscriverebbe
     i testi sotto React e GSAP (titoli spezzati, lingua che non cambia più). -->
<meta name="google" content="notranslate">
<script>
  // Prima di tutto il resto, senza aspettare il JavaScript del sito:
  // 1) chi apre la home "/" (anche "/index.html") va alla lingua del browser: /it/, /fr/, altrimenti inglese.
  //    Vince solo una scelta fatta con i pulsanti EN/IT/FR durante la stessa visita (sessionStorage,
  //    vb-lang): alla visita successiva decide di nuovo il browser.
  // 2) gli elementi dell'animazione d'ingresso restano nascosti finché GSAP non li prende in carico
  //    (al massimo 4 s, se il JavaScript non dovesse arrivare).
  (function () {
    var d = document.documentElement
    var base = '%BASE_URL%'
    var path = location.pathname.replace(/index\.html$/, '')
    if (path === base || path + '/' === base) {
      var saved = null
      try {
        saved = sessionStorage.getItem('vb-lang')
        // versione precedente: la scelta restava per sempre e copriva la lingua del browser
        localStorage.removeItem('vb-lang')
      } catch (e) {}
      var prefs = (navigator.languages || [navigator.language || 'en']).map(function (l) { return String(l).slice(0, 2).toLowerCase() })
      var lng = saved || prefs.filter(function (l) { return l === 'en' || l === 'it' || l === 'fr' })[0] || 'en'
      if (lng !== 'en') { location.replace(base + lng + '/' + location.hash); return }
    }
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      d.classList.add('intro-pending')
      setTimeout(function () { d.classList.remove('intro-pending') }, 4000)
    }
  })()
</script>
<!--lang-head-->
<title>Valentina Bernardi — Ski instructor in Les Arcs, Val d'Isère &amp; Tignes</title>
<meta name="description" content="Private, children's and family ski lessons in Les Arcs, Val d'Isère and Tignes with Valentina Bernardi.">
<link rel="canonical" href="%SITE_URL%/">
<!--/lang-head-->
<meta name="theme-color" content="#26262A">
<link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml">
<link rel="icon" href="%BASE_URL%icons/favicon-48.png" sizes="48x48" type="image/png">
<link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png">
<link rel="manifest" href="%BASE_URL%site.webmanifest">
<!--hero-preload-->
<meta property="og:site_name" content="Valentina Bernardi — Vally Ski">
<meta property="og:type" content="website">
<meta property="og:image" content="%SITE_URL%/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<!--json-ld-->
</head>
<body>
<div id="root"><!--app--></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
